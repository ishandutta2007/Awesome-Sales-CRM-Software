<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity=".03"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes pulse-glow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@keyframes shimmer{0%{stop-color:#6366f1}50%{stop-color:#ec4899}}.bg{fill:url(#bg-grad)}.floating-bg-element,.pulsing-orb{animation:float 8s ease-in-out infinite;transform-origin:center}.pulsing-orb{animation:pulse-glow 6s ease-in-out infinite}.animated-line{stroke-dasharray:8 8;animation:dash 3s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:400;fill:#cbd5e1}.badge-text{font-weight:600;fill:#a5b4fc}</style><rect width="1000" height="300" class="bg" rx="16"/><g opacity=".35"><circle cx="850" cy="80" r="140" fill="#a855f7" class="pulsing-orb" filter="url(#glow)"/><circle cx="1