<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card/Pill Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Text Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes shimmer {
      0% { stop-color: #6366f1; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #6366f1; }
    }

    .bg { fill: url(#bg-grad); }
    .floating-bg-element { animation: float 8s ease-in-out infinite; transform-origin: center; }
    .pulsing-orb { animation: pulse-glow 6s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8 8; animation: dash 3s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #a5b4fc; }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="300" rx="16" class="bg"/>

  <!-- Dynamic Background Graphic Elements (Behind Text) -->
  <g opacity="0.35">
    <!-- Pulsing Orbs -->
    <circle cx="850" cy="80" r="140" fill="#a855f7" class="pulsing-orb" filter="url(#glow)" />
    <circle cx="150" cy="240" r="100" fill="#6366f1" class="pulsing-orb" filter="url(#glow)" />

    <!-- Animated Data Flow Lines -->
    <path d="M 50,220 Q 250,140 450,210 T 850,120 T 950,180" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="animated-line" opacity="0.6"/>
    <path d="M 100,80 Q 350,180 600,90 T 900,220" fill="none" stroke="#6366f1" stroke-width="1.5" class="animated-line" opacity="0.4"/>

    <!-- Pipeline Nodes (Decorative Background Elements) -->
    <g class="floating-bg-element">
      <circle cx="780" cy="180" r="28" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5"/>
      <path d="M770 180 L777 187 L792 172" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      
      <circle cx="880" cy="130" r="22" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="680" cy="110" r="18" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Foreground Banner Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="240" height="32" rx="16" fill="url(#card-grad)" stroke="url(#accent-grad)" stroke-width="1"/>
    <text x="120" y="21" text-anchor="middle" class="badge-text" font-size="13" letter-spacing="1">🚀 SALES CRM ECOSYSTEM</text>
  </g>

  <!-- Main Title & Subtitle in Foreground (Clean Contrast) -->
  <g transform="translate(60, 135)" filter="url(#shadow)">
    <text x="0" y="0" class="title-text" font-size="44" letter-spacing="-0.5">Awesome Sales CRM Software</text>
    <text x="0" y="38" class="subtitle-text" font-size="18">Top Commercial SaaS Platforms &amp; Open-Source CRM Solutions</text>
    <text x="0" y="64" class="subtitle-text" font-size="14" fill="#94a3b8">Pipeline Management • Lead Tracking • Contact Management • Revenue Automation</text>
  </g>

  <!-- Feature Pills Footer -->
  <g transform="translate(60, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="32" rx="8" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
      <text x="85" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#e2e8f0" font-weight="500">📊 SaaS Benchmarks</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(185, 0)">
      <rect width="170" height="32" rx="8" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
      <text x="85" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#e2e8f0" font-weight="500">⭐ Open-Source Ranked</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(370, 0)">
      <rect width="180" height="32" rx="8" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" font-family="system-ui" font-size="12" fill="#e2e8f0" font-weight="500">💰 Pricing &amp; Free Tiers</text>
    </g>
  </g>
</svg>
